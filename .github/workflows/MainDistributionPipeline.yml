#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: anofox_ml
      enable_rust: true
      reduced_ci_mode: disabled
      # The wasm job of extension-ci-tools v1.5.6 pins rustc 1.86, but
      # anofox-ml 0.2 needs 1.87: the wasm builds run in the job below.
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads"

  # DuckDB-Wasm builds: extension-ci-tools' wasm job with a current Rust
  # toolchain instead of its pinned 1.86 (DataZooDE/anofox-ml#29).
  wasm:
    name: DuckDB-Wasm (${{ matrix.duckdb_arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        duckdb_arch: [wasm_mvp, wasm_eh, wasm_threads]
    env:
      VCPKG_TARGET_TRIPLET: wasm32-emscripten
      VCPKG_HOST_TRIPLET: x64-linux
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extension-ci-tools/vcpkg_ports
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/extension-ci-tools/toolchains
      DUCKDB_PLATFORM: ${{ matrix.duckdb_arch }}
      WASM_EXTENSIONS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - uses: actions/checkout@v4
        with:
          path: 'extension-ci-tools'
          ref: v1.5.6
          repository: duckdb/extension-ci-tools

      - name: Checkout DuckDB to version
        run: DUCKDB_GIT_VERSION=v1.5.6 make set_duckdb_version

      - uses: emscripten-core/setup-emsdk@v13
        with:
          version: 3.1.71

      - name: Setup Rust for cross compilation
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - name: Setup vcpkg
        run: |
          mkdir local_vcpkg_installation
          cd local_vcpkg_installation
          git init
          git remote add origin https://github.com/microsoft/vcpkg.git
          git fetch origin 84bab45d415d22042bd0b9081aea57f362da3f35
          git checkout 84bab45d415d22042bd0b9081aea57f362da3f35
          ./bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=${{ github.workspace }}/local_vcpkg_installation" >> $GITHUB_ENV
          echo "VCPKG_TOOLCHAIN_PATH=${{ github.workspace }}/local_vcpkg_installation/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "${{ github.workspace }}/local_vcpkg_installation" >> $GITHUB_PATH

      - name: Run configure
        env:
          DUCKDB_GIT_VERSION: v1.5.6
        run: make configure_ci

      - name: Build Wasm module
        run: EXTENSION_NAME=anofox_ml ENABLE_EXTENSION_AUTOINSTALL=1 ENABLE_EXTENSION_AUTOLOADING=1 make ${{ matrix.duckdb_arch }}

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: anofox_ml-v1.5.6-extension-${{ matrix.duckdb_arch }}
          path: build/${{ matrix.duckdb_arch }}/extension/anofox_ml/anofox_ml.duckdb_extension.wasm

  build-and-test-rust:
    name: Build and test Rust components
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build Rust library
        run: cargo build --release

      - name: Run Rust tests
        run: cargo test --all-features

  # On a version tag (v*): attach the extension binaries of this run to a
  # GitHub release, with the CHANGELOG section of that version as notes.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [duckdb-stable-build, wasm, build-and-test-rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: anofox_ml-v1.5.6-extension-*
          path: artifacts

      # DuckDB derives the entry point from the file name, so each platform
      # ships as a zip holding anofox_ml.duckdb_extension under that name.
      # The wasm builds are left out: they don't link the Rust core yet
      # (DataZooDE/anofox-ml#29).
      - name: Collect binaries
        run: |
          mkdir dist
          for dir in artifacts/anofox_ml-v1.5.6-extension-*; do
            arch="${dir##*-extension-}"
            case "$arch" in wasm_*) continue ;; esac
            (cd "$dir" && zip -9 "$GITHUB_WORKSPACE/dist/anofox_ml-${GITHUB_REF_NAME}-duckdb-v1.5.6-${arch}.zip" anofox_ml.duckdb_extension)
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for ${GITHUB_REF_NAME}"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "anofox_ml $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: anofox_ml
      enable_rust: true
      reduced_ci_mode: disabled
      # The wasm job of extension-ci-tools v1.5.6 pins rustc 1.86, but
      # anofox_ml needs 1.88 (perpetual): the wasm builds run in the job below.
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads"

  # The same source against DuckDB 2.0 (src/include/duckdb_compat.hpp).
  duckdb-2-build:
    name: Build extension binaries (DuckDB 2.0)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: anofox_ml
      enable_rust: true
      reduced_ci_mode: disabled
      # The wasm builds use its emsdk 6 and the Rust pinned in CMakeLists.txt.

  # DuckDB-Wasm builds: extension-ci-tools' wasm job with a current Rust
  # toolchain instead of its pinned 1.86 (DataZooDE/anofox-ml#29).
  wasm:
    name: DuckDB-Wasm (${{ matrix.duckdb_arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        duckdb_arch: [wasm_mvp, wasm_eh, wasm_threads]
    env:
      VCPKG_TARGET_TRIPLET: wasm32-emscripten
      VCPKG_HOST_TRIPLET: x64-linux
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extension-ci-tools/vcpkg_ports
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/extension-ci-tools/toolchains
      DUCKDB_PLATFORM: ${{ matrix.duckdb_arch }}
      WASM_EXTENSIONS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - uses: actions/checkout@v4
        with:
          path: 'extension-ci-tools'
          ref: v1.5.6
          repository: duckdb/extension-ci-tools

      - name: Checkout DuckDB to version
        run: DUCKDB_GIT_VERSION=v1.5.6 make set_duckdb_version

      - uses: emscripten-core/setup-emsdk@v13
        with:
          version: 3.1.71

      - name: Setup Rust for cross compilation
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - name: Setup vcpkg
        run: |
          mkdir local_vcpkg_installation
          cd local_vcpkg_installation
          git init
          git remote add origin https://github.com/microsoft/vcpkg.git
          git fetch origin 84bab45d415d22042bd0b9081aea57f362da3f35
          git checkout 84bab45d415d22042bd0b9081aea57f362da3f35
          ./bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=${{ github.workspace }}/local_vcpkg_installation" >> $GITHUB_ENV
          echo "VCPKG_TOOLCHAIN_PATH=${{ github.workspace }}/local_vcpkg_installation/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "${{ github.workspace }}/local_vcpkg_installation" >> $GITHUB_PATH

      - name: Run configure
        env:
          DUCKDB_GIT_VERSION: v1.5.6
        run: make configure_ci

      - name: Build Wasm module
        run: EXTENSION_NAME=anofox_ml ENABLE_EXTENSION_AUTOINSTALL=1 ENABLE_EXTENSION_AUTOLOADING=1 make ${{ matrix.duckdb_arch }}

      # The Rust FFI must be linked into the module, not left as imports (#29).
      - name: Check the Rust FFI is linked
        run: python3 scripts/check_wasm_imports.py build/${{ matrix.duckdb_arch }}/extension/anofox_ml/anofox_ml.duckdb_extension.wasm

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: anofox_ml-v1.5.6-extension-${{ matrix.duckdb_arch }}
          path: build/${{ matrix.duckdb_arch }}/extension/anofox_ml/anofox_ml.duckdb_extension.wasm

  # Load the wasm builds in DuckDB-Wasm (Node) and run test/sql there: the
  # import check above cannot see runtime failures (#84). Checked statically
  # only: wasm_threads (needs a cross-origin-isolated browser) and wasm_mvp
  # (the npm mvp bundle fails on any C++ exception, "_setThrew is not
  # defined", even without an extension). The DuckDB 2.0 npm builds have one
  # single-threaded bundle (base), as wasm_eh.
  wasm-runtime:
    name: DuckDB-Wasm runtime (${{ matrix.duckdb }}, ${{ matrix.duckdb_arch }})
    needs: [wasm, duckdb-2-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - duckdb: v1.5.6
            duckdb_arch: wasm_eh
            bundle: eh
            duckdb_wasm: 1.33.1-dev65.0
          - duckdb: v2.0.0
            duckdb_arch: wasm_eh
            bundle: base
            duckdb_wasm: 1.33.1-dev114.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: anofox_ml-${{ matrix.duckdb }}-extension-${{ matrix.duckdb_arch }}
          path: wasm-artifact

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # @duckdb/duckdb-wasm 1.33.1-dev65.0 bundles DuckDB v1.5.6, dev114.0 v2.0.0.
      - name: Install the harness
        run: |
          npm --prefix test/wasm ci
          npm --prefix test/wasm install --no-save @duckdb/duckdb-wasm@${{ matrix.duckdb_wasm }}

      - name: Run test/sql in DuckDB-Wasm
        run: node test/wasm/run.mjs --bundle ${{ matrix.bundle }} --ext wasm-artifact/anofox_ml.duckdb_extension.wasm

  build-and-test-rust:
    name: Build and test Rust components
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build Rust library
        run: cargo build --release

      - name: Run Rust tests
        run: cargo test --all-features

  # On a version tag (v*): attach the extension binaries of this run to a
  # GitHub release, with the CHANGELOG section of that version as notes.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [duckdb-stable-build, duckdb-2-build, wasm, wasm-runtime, build-and-test-rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: anofox_ml-v*-extension-*
          path: artifacts

      # DuckDB derives the entry point from the file name, so each platform
      # ships as a zip holding anofox_ml.duckdb_extension (.wasm for
      # DuckDB-Wasm) under that name.
      - name: Collect binaries
        run: |
          mkdir dist
          for dir in artifacts/anofox_ml-v*-extension-*; do
            arch="${dir##*-extension-}"
            duckdb="${dir#artifacts/anofox_ml-}"
            duckdb="${duckdb%%-extension-*}"
            (cd "$dir" && zip -9 "$GITHUB_WORKSPACE/dist/anofox_ml-${GITHUB_REF_NAME}-duckdb-${duckdb}-${arch}.zip" anofox_ml.duckdb_extension*)
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for ${GITHUB_REF_NAME}"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "anofox_ml $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

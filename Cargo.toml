[workspace]
members = ["crates/anofox-ml-ffi"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
# perpetual (PerpetualBooster kinds) needs 1.88
rust-version = "1.88"
license = "BUSL-1.1"
repository = "https://github.com/DataZooDE/anofox-ml"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

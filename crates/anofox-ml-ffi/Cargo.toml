[package]
name = "anofox_ml_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI over anofox-ml-registry for the anofox_ml DuckDB extension"

[lib]
crate-type = ["staticlib"]

[dependencies]
anofox-ml-core = "0.2"
anofox-ml-registry = "0.2"
anofox-ml-metrics = "0.2"
anofox-ml-conformal = "0.2"
anofox-ml-text = "0.2"
anofox-ml-preprocessing = "0.2"
anofox-ml-cluster = "0.2"
anofox-ml-discriminant = "0.2"
ndarray = "0.16"
rand = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
